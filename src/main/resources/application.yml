server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: LexAtlas
  # 数据库配置（本地开发默认值；Docker 部署时由 docker-compose 环境变量覆盖）
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/lexatlas?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  # 文件上传
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-aliases-package: com.lexatlas.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# MinIO 配置
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET_NAME:lexatlas}

# 本地文件上传配置（头像等文件直接存磁盘，不走 MinIO）
upload:
  path: uploads

# Milvus 配置
milvus:
  host: ${MILVUS_HOST:127.0.0.1}
  port: ${MILVUS_PORT:19530}
  collection-name: ${MILVUS_COLLECTION_NAME:legal_knowledge}
  dimension: 1024

# JWT 配置
# 生产环境务必通过环境变量 JWT_SECRET 注入高强度密钥，切勿使用下方默认值
jwt:
  secret: ${JWT_SECRET:change-this-development-secret-before-production-123456}
  expiration: 86400000  # 24小时 (毫秒)
  refresh-expiration: 604800000  # 7天 (毫秒)

# LLM 配置 (阿里云百炼 DashScope，兼容 OpenAI 接口格式)
# 可替换为其他 OpenAI 兼容接口（DeepSeek / 通义千问 / 本地 Ollama 等）
llm:
  base-url: ${LLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  api-key: ${BAILIAN_API_KEY:}          # 从系统环境变量读取 API Key
  model: ${LLM_MODEL:qwen-plus}         # 可选: qwen-turbo / qwen-plus / qwen-max
  embedding-model: text-embedding-v3    # 输出维度 1024，与 Milvus 一致
  timeout: 60

# 重排序配置 (阿里云 gte-rerank)
reranker:
  api-url: https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank
  model: gte-rerank

# Actuator 可观测性（生产环境建议仅暴露 health/info）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# OpenAPI / Swagger 文档（生产环境置为 false 关闭）
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:5173}
  bootstrap-admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
  password-reset:
    demo-mode: ${PASSWORD_RESET_DEMO_MODE:false}

# 应用信息（Actuator /info 展示）
info:
  app:
    name: LexAtlas
    description: RAG-powered Legal Intelligence Platform
    version: 1.0.0

# 日志配置
logging:
  level:
    com.lexatlas: INFO
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
