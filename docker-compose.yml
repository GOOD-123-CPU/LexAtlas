# LexAtlas 法枢 · RAG-Powered Legal Intelligence Platform — 一键部署配置
# 使用方式：docker compose up -d
# 说明：重排序已直接调用阿里云 gte-rerank API，无需独立微服务；
#       LLM API Key 通过环境变量 BAILIAN_API_KEY 注入（.env 文件或系统环境变量）。

services:
  # ===== MySQL 数据库 =====
  mysql:
    image: mysql:8.0
    container_name: lexatlas-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-lexatlas2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lexatlas}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/sql/lexatlas.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lexatlas-net

  # ===== Redis 缓存 =====
  redis:
    image: redis:7-alpine
    container_name: lexatlas-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - lexatlas-net

  # ===== MinIO 对象存储 =====
  minio:
    image: minio/minio:latest
    container_name: lexatlas-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - lexatlas-net

  # ===== Milvus 向量数据库（依赖 etcd + MinIO）=====
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: lexatlas-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd
      -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - etcd_data:/etcd
    networks:
      - lexatlas-net

  milvus:
    image: milvusdb/milvus:v2.3.4
    container_name: lexatlas-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    depends_on:
      - etcd
      - minio
    networks:
      - lexatlas-net

  # ===== SpringBoot 后端 =====
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lexatlas-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/lexatlas?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-lexatlas2026}
      SPRING_DATA_REDIS_HOST: redis
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MILVUS_HOST: milvus
      BAILIAN_API_KEY: ${BAILIAN_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PASSWORD_RESET_DEMO_MODE: ${PASSWORD_RESET_DEMO_MODE:-false}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      milvus:
        condition: service_started
    networks:
      - lexatlas-net

  # ===== Nginx 前端 =====
  frontend:
    build:
      context: ./lexatlas-frontend
      dockerfile: Dockerfile
    container_name: lexatlas-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - lexatlas-net

volumes:
  mysql_data:
  redis_data:
  minio_data:
  etcd_data:
  milvus_data:

networks:
  lexatlas-net:
    driver: bridge
